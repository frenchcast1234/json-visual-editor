name: json_visual_editor
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  menu_bar: ^0.5.3
  file: ^7.0.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: CascadiaMono
      fonts:
      - asset: assets/cascadia-variable.ttf
      - asset: assets/cascadia-italic-variable.ttf
        style: italic